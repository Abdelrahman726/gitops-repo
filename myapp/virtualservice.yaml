apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: myapp
spec:
  hosts: ["*"]
  gateways: [myapp-gw]

  http:
  - route:
    - destination:
        host: myapp
        port:
          number: 80

    timeout: 10s

    retries:
      attempts: 3
      perTryTimeout: 2s
      retryOn: 5xx,connect-failure,reset
